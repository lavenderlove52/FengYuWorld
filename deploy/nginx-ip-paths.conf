# 单 IP、单端口（80）按路径分流
#
# 路径规划：
#   /webdav/*  → 坚果云 / KeePass relay（127.0.0.1:10000）
#   /blog/*    → My-Blog 前端 SPA + API
#   /uploads/* → My-Blog 上传文件（Go 静态目录）
#
# 安装：
#   cp deploy/nginx-ip-paths.conf /etc/nginx/conf.d/myblog.conf
#   # 禁用旧的 jian-guo-yun-relay.conf（避免重复 listen 80）
#   mv /etc/nginx/conf.d/jian-guo-yun-relay.conf /etc/nginx/conf.d/disabled/
#   nginx -t && systemctl reload nginx
#
# 访问：
#   博客：http://YOUR_IP/blog/
#   WebDAV：http://YOUR_IP/webdav/  （KeePass 客户端 URL 需同步修改）

server {
    listen 80;
    server_name 124.223.116.8;

    client_max_body_size 50m;

    # ---------- My-Blog API ----------
    location /blog/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- My-Blog 上传文件 ----------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # ---------- My-Blog 前端（Vue SPA） ----------
    # 静态文件目录：/var/www/blog/（含 index.html、assets/）
    # 上传：scp -r dist/* root@IP:/var/www/blog/
    location /blog/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /blog/index.html;
    }

    # ---------- 坚果云 relay / WebDAV ----------
    # KeePass 等客户端地址改为：http://YOUR_IP/webdav/
    location /webdav/ {
        proxy_pass http://127.0.0.1:10000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 根路径：可选跳转博客或返回 404
    location = / {
        return 302 /blog/;
    }
}
